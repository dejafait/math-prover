research_task:
  description: >
    Conduct a thorough research about the current state of the Riemann Hypothesis.
    Look for the latest papers, major approaches, known obstacles, and any significant 
    developments. The current year is 2026.
  expected_output: >
    A list with 8-12 bullet points of the most relevant and up-to-date information 
    about the Riemann Hypothesis, including key references and important results.
  agent: researcher

conjecture_task:
  description: >
    Based on the research summary, generate 4 to 6 original, creative ideas or 
    unexpected connections that could potentially help prove the Riemann Hypothesis.
    Think outside the box (e.g. links to physics, fractals, quantum chaos, L-functions, etc.).
  expected_output: >
    A numbered list of 4-6 concrete conjectures or novel angles, each with a short 
    explanation of why it might be promising.
  agent: conjecturer

testing_task:
  description: >
    For each conjecture or idea from the previous step, suggest concrete numerical 
    tests, symbolic checks, or possible ways it could be falsified using zeta function 
    computations or known zero distributions.
  expected_output: >
    A detailed evaluation for each idea: suggested tests, potential counter-examples, 
    and where it might fail.
  agent: tester

critic_task:
  description: >
    Critically review all previous outputs (research, conjectures, and tests). 
    Find every logical gap, mathematical contradiction, or reason why an idea is 
    unlikely to lead to a full proof of the Riemann Hypothesis.
  expected_output: >
    An honest, sharp assessment for each idea: strengths, fatal weaknesses, and 
    overall likelihood of success. Be ruthless.
  agent: critic

reporting_task:
  description: >
    Compile all previous results (research, conjectures, tests, and criticism) 
    into a professional, well-structured final report about the Riemann Hypothesis.
  expected_output: >
    A complete, well-organized markdown report with the following sections:
    - Executive Summary
    - Current State of Research
    - Novel Ideas Proposed
    - Numerical Testing & Potential Failures
    - Critical Assessment
    - Recommendations for Next Steps
    Formatted cleanly as markdown without code blocks.
  agent: reporting_analyst